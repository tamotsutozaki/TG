<div class="page-header">
  <h2>Tipos de Exame</h2>
  <button mat-raised-button color="primary" (click)="novo()">
    <mat-icon>add</mat-icon> Novo Tipo
  </button>
</div>

@if (loading) {
  <div class="loading-center"><mat-spinner diameter="48"></mat-spinner></div>
} @else if (tipos.length === 0) {
  <mat-card class="empty-state">
    <mat-icon>science</mat-icon>
    <p>Nenhum tipo de exame cadastrado.</p>
    <button mat-raised-button color="primary" (click)="novo()">Cadastrar primeiro tipo</button>
  </mat-card>
} @else {
  <mat-card>
    <table mat-table [dataSource]="tipos" class="w-100">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let t"><strong>{{ t.nome }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="prazo">
        <th mat-header-cell *matHeaderCellDef>Prazo (dias)</th>
        <td mat-cell *matCellDef="let t">{{ t.prazoEstimadoDias }}</td>
      </ng-container>

      <ng-container matColumnDef="ativo">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let t">
          <span class="status-chip" [class]="t.ativo ? 'EmAnalise' : 'Concluido'">
            {{ t.ativo ? 'Ativo' : 'Inativo' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let t">
          <button mat-icon-button (click)="templates(t)" matTooltip="Gerenciar templates">
            <mat-icon>description</mat-icon>
          </button>
          <button mat-icon-button (click)="editar(t)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="excluir(t)" matTooltip="Desativar"
            [disabled]="!t.ativo">
            <mat-icon>block</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>
  </mat-card>
}
